
name: JRA Official Results Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          tesseract --version
          tesseract --list-langs

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Audit official results PDF
        run: |
          python src/official_results_audit.py

      - name: Upload extracted text
        uses: actions/upload-artifact@v4
        with:
          name: official-results-audit
          path: |
            data/official_extracted_text/
            data/official_page_images/
