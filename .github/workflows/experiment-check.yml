
name: Keiba AI Experiment Check

on:
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Run model experiment
        run: |
          python src/model_experiment.py

      - name: Upload experiment history
        uses: actions/upload-artifact@v4
        with:
          name: model-experiment-history
          path: data/experiments/experiment_history.csv
