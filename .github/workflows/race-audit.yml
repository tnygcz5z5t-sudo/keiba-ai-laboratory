
name: Keiba AI Race Data Audit

on:
  workflow_dispatch:

jobs:
  race-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Extract PDF text
        run: |
          python src/pdf_loader.py

      - name: Parse PDF text
        run: |
          python src/pdf_parser.py

      - name: Parse past runs
        run: |
          python src/past_run_parser.py

      - name: Audit race data
        run: |
          python src/race_data_audit.py
