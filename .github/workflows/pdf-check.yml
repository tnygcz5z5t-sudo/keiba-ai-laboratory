
name: Keiba AI PDF Check

on:
  workflow_dispatch:

jobs:
  pdf-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Extract PDF text
        run: |
          python src/pdf_loader.py

      - name: Parse PDF text
        run: |
          python src/pdf_parser.py

      - name: Parse past runs
        run: |
          python src/past_run_parser.py

      - name: Validate past run data
        run: |
          python src/data_validator.py

      - name: Calculate speed features
        run: |
          python src/speed_feature.py

      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: pdf-parsed-data
          path: |
            data/extracted_text/
            data/past_performances.csv
            data/past_runs.csv
            data/speed_features.csv
            data/horse_speed_summary.csv
